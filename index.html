<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leandro CineMax - Cinema em Casa</title>
    
    <!-- SEO & Open Graph Meta Tags -->
    <meta name="description" content="Assista a filmes e séries com a melhor qualidade na Leandro CineMax. A sua plataforma de cinema em casa." />
    <meta name="keywords" content="cinema, filmes, séries, iptv, leandro cinemax, streaming" />
    <meta property="og:title" content="Leandro CineMax - Cinema em Casa" />
    <meta property="og:description" content="Assista a filmes e séries com a melhor qualidade na Leandro CineMax." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#E50914" />

    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    
    <!-- Preload Critical CSS -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body { background-color: #050505; color: #F5F7FA; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
      #initial-loader {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #050505; display: flex; align-items: center; justify-content: center; z-index: 9999;
      }
      .spinner {
        width: 40px; height: 40px; border: 3px solid rgba(229, 9, 20, 0.2);
        border-top-color: #E50914; border-radius: 50%; animation: spin 0.8s linear infinite;
        will-change: transform;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" aria-hidden="true">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
