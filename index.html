<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Leandro CineMax - Cinema em Casa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
      body { background-color: #050505; color: #F5F7FA; margin: 0; padding: 0; font-family: sans-serif; }
      #initial-loader {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #050505; display: flex; align-items: center; justify-content: center; z-index: 9999;
      }
      .spinner {
        width: 40px; height: 40px; border: 3px solid rgba(123, 44, 255, 0.2);
        border-top-color: #7B2CFF; border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
